[project]
name = "voice-ai"
version = "2.0.0"
description = "SVKM NMIMS Global University Dhule AI Voice Admission & Intelligent Counselor Routing Platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "uvicorn>=0.28.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "aiofiles>=23.2.1",
    "jinja2>=3.1.3",
    "python-dotenv>=1.0.1"
]

[tool.vercel]
entrypoint = "backend/app/main.py"
